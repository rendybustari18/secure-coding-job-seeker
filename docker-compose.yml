services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobseeker_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - jobseeker_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobseeker_backend
    ports:
      - "8004:80"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_job_seeker
      DB_USER: root
      DB_PASS: root
      BASE_URL: http://localhost:8004
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend:/var/www/html
      - backend_uploads:/var/www/html/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jobseeker_network

  mysql:
    image: mysql:8.0
    container_name: jobseeker_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_job_seeker
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    ports:
      - "3317:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - jobseeker_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jobseeker_phpmyadmin
    depends_on:
      - mysql
    ports:
      - "9006:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
      UPLOAD_LIMIT: 50M
    restart: always
    networks:
      - jobseeker_network

volumes:
  mysql_data:
  backend_uploads:

networks:
  jobseeker_network:
    driver: bridge

